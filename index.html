<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joe救英文 - 單字練習平台</title>
    <meta name="description" content="Joe救英文 - 英文單字練習平台，輕鬆掌握必備詞彙。" />
    <meta name="author" content="Joe救英文" />
    <meta name="keywords" content="英文學習, 單字練習, 詞彙練習, 線上學習" />

    <meta property="og:title" content="Joe救英文" />
    <meta property="og:description" content="英文單字練習平台" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>

  <body>
    <!--
      #root 裡這段是「JS 沒跑起來」的保底畫面。

      React 的 createRoot().render() 掛載時會清掉容器內原有的節點，所以
      正常情況下使用者永遠看不到它；只有在 JS 檔沒載到、被擋掉、或解析失敗
      時才會留在畫面上。

      在這之前這個 div 是空的，那種情況下整頁就是一片米白 ——
      使用者只能回報「空白頁面」，我們拿不到任何線索。

      刻意用行內樣式而不是 Tailwind：真正要保底的情境包含「CSS 也沒載到」。
      var() 的第二個參數是 index.css 沒生效時的退路，數值與 :root 一致。
    -->
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
                  font-family:Inter,'Noto Sans TC',system-ui,-apple-system,sans-serif;
                  background:hsl(var(--background, 42 45% 96%));
                  color:hsl(var(--foreground, 25 35% 15%));">
        <div style="max-width:420px;width:100%;text-align:center;
                    background:hsl(var(--card, 40 40% 98%));
                    border:1px solid hsl(var(--border, 40 25% 85%));
                    border-radius:12px;padding:24px;">
          <h1 style="margin:0 0 8px;font-size:1.25rem;font-weight:700;">載入失敗</h1>
          <p style="margin:0 0 20px;font-size:0.875rem;line-height:1.6;
                    color:hsl(var(--muted-foreground, 25 20% 45%));">
            網頁沒有正常載入。多半是網路不穩或瀏覽器快取到舊版本，
            重新整理通常就好了。如果一直這樣，請清除這個網站的資料再開一次。
          </p>
          <button type="button" onclick="location.reload()"
                  style="width:100%;height:44px;border:0;border-radius:8px;cursor:pointer;
                         font-size:0.9375rem;font-weight:600;
                         background:hsl(var(--primary, 38 92% 50%));
                         color:hsl(var(--primary-foreground, 0 0% 100%));">
            重新整理
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
