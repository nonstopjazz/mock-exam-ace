name: E2E（學生端閱讀流程）

on:
  pull_request:
    paths:
      - "src/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "vite.config.e2e.ts"
      - "package.json"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 🛑 瀏覽器要自己裝。.npmrc 擋掉了 npm install 時的下載——
      #    不擋的話 Vercel 每次部署都會多抓一份 ~150MB。
      - run: npx playwright install --with-deps chromium

      - run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
